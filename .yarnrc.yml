---
nodeLinker: node-modules

# Required, not optional: Yarn's default is an empty allowlist, which blocks
# every Git fetch, so a repo with Git dependencies cannot install without
# this. Scoped to Scality rather than the "**" Yarn writes during migration.
approvedGitRepositories:
  - 'https://github.com/scality/*'
  - 'ssh://git@github.com/scality/*'

# fcntl has no checksum in yarn.lock. It is a git dependency with a node-gyp
# build, so Yarn repacks it locally and the archive is not byte-reproducible —
# the hash differs between machines and even between runs on one machine.
# Removing just its checksum keeps integrity checking for every other package,
# unlike checksumBehavior: update. Publishing scality/node-fcntl to npm as
# fcntl@0.3.0 (the name is free, the repo is public) would make the archive
# deterministic and let the checksum come back.

# Several dependencies are Git repos that still carry Yarn 1 lockfiles, so Yarn
# bootstraps them with Yarn Classic when repacking. Run those serially: in
# parallel they race on Classic's shared cache and packing fails with ENOENT
# (YN0058). This replaces the --network-concurrency 1 flag Yarn 1 used, which
# Berry rejects on the CLI but still honours as a setting. It can be dropped
# once those dependency repos are themselves on Berry.
networkConcurrency: 1
