---
nodeLinker: node-modules

# Yarn's default is an empty allowlist, which blocks every Git fetch.
approvedGitRepositories:
  - 'https://github.com/scality/*'
  - 'ssh://git@github.com/scality/*'

# Git dependencies with Yarn 1 lockfiles are bootstrapped by Yarn Classic,
# which corrupts its shared cache when run in parallel (YN0058). Droppable
# once those dependencies are on Berry.
networkConcurrency: 1

# Skip the one-day quarantine on new releases for our own packages.
npmPreapprovedPackages:
  - '@scality/*'
